name: CN EOD Archive

on:
  schedule:
    - cron: '0 10 * * 1-5'   # 工作日 BJT 18:00 (UTC 10:00) — 收盘后 EOD 日线结算完成再归档
  workflow_dispatch:

env:
  # uv 冻结模式: pyproject/uv.lock 漂移(dependabot 改约束未同步 lock)时不改写 uv.lock,
  # 防脏工作树 -> Commit 步骤 git pull --rebase exit 128 停更 (2026-07-09 事故加固)
  UV_FROZEN: "1"

permissions:
  contents: write
  actions: write   # 用于触发 deploy-frontend workflow

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    # 实测 EOD 全量刷新 65-71min (东财断连重试风暴); 20min 是 2026-07-12 防hang加固时的误配,
    # 导致 07-13 起 26 个 run 全被 cancel、快照停更 5 周 (后靠 backfill 补 07-11~08-07).
    # 根治(降低刷新耗时)在 provider 韧性, 见 docs data-fetch-resilience; 此处 90min = 最差实测 +27% 余量.
    timeout-minutes: 90
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check CN trading day
        id: cal
        run: |
          pip install chinese-calendar -q
          is_trading=$(python -c "
          from datetime import datetime, timezone, timedelta
          import chinese_calendar
          today = (datetime.now(timezone.utc) + timedelta(hours=8)).date()
          # 须与 src/etl/calendar.py is_cn_trading_day 同步: isoweekday 保护 + 调休误判/未来年兜底
          def _ok(d):
              if d.isoweekday() > 5:
                  return False
              try:
                  return chinese_calendar.is_workday(d) and not chinese_calendar.is_holiday(d)
              except NotImplementedError:
                  return False
          ok = _ok(today)
          print('true' if ok else 'false')
          ")
          echo "is_trading=$is_trading" >> $GITHUB_OUTPUT
          echo "trading_day=$is_trading"
      - uses: actions/checkout@v7
        if: steps.cal.outputs.is_trading == 'true'
        with:
          token: ${{ secrets.DATA_BOT_PAT }}
      - uses: astral-sh/setup-uv@v9.0.0
        if: steps.cal.outputs.is_trading == 'true'
        id: setup-uv
        continue-on-error: true
        with:
          version: "0.11.x"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup uv (retry on transient network failure)
        if: steps.cal.outputs.is_trading == 'true' && steps.setup-uv.outcome == 'failure'
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.x"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.cal.outputs.is_trading == 'true'
        run: cd backend && uv sync --extra dev --frozen
      # 收盘后再全量抓一次: 此时 EOD 日线已结算, latest/ 拿到当日真数据.
      # 若仍抓到陈旧数据 (provider 滞后/失败), 下游 archive 的新鲜度护栏会拒绝归档.
      - name: Refresh full (settled EOD data)
        if: steps.cal.outputs.is_trading == 'true'
        run: cd backend && uv run python -m src.pipeline --mode=full --data-root=../data --config-dir=../config
        continue-on-error: true
      - name: Archive latest → snapshots/<today-bjt>
        if: steps.cal.outputs.is_trading == 'true'
        run: cd backend && uv run python -m src.pipeline --mode=archive --data-root=../data --config-dir=../config
      - name: Compute commit metadata
        if: steps.cal.outputs.is_trading == 'true'
        id: meta
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Commit archive
        if: steps.cal.outputs.is_trading == 'true'
        id: commit
        # snapshots/ 是归档主体; latest/ 一并提交, 让前端实时视图也拿到收盘结算后的 EOD 数据
        uses: ./.github/actions/commit-and-push
        with:
          paths: data/snapshots/ data/latest/
          message: "data: EOD archive ${{ steps.meta.outputs.date }}"
      - name: Trigger deploy
        # 仅在确有 commit 时部署, 避免无变化空跑
        if: steps.cal.outputs.is_trading == 'true' && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-frontend.yml --ref main
