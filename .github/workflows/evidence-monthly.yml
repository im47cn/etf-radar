name: Evidence Monthly

# 月度重算 strength IC + 主题 ARCH -> data/latest/signal_evidence.json (前端 /evidence 页).
# CI 读 data/snapshots/ 全量 (含 2021-2025 历史, 已入 git) 做 5 年样本外统计.
on:
  schedule:
    - cron: '7 0 2 * *'      # 每月 2 日 00:07 UTC (08:07 BJT)
  workflow_dispatch:

env:
  # uv 冻结模式: pyproject/uv.lock 漂移(dependabot 改约束未同步 lock)时不改写 uv.lock,
  # 防脏工作树 -> Commit 步骤 git pull --rebase exit 128 停更 (2026-07-09 事故加固)
  UV_FROZEN: "1"

permissions:
  contents: write
  actions: write

concurrency:
  group: evidence-monthly
  cancel-in-progress: false

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.DATA_BOT_PAT }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v9.0.0
        id: setup-uv
        continue-on-error: true
        with:
          version: "0.11.x"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup uv (retry on transient network failure)
        if: steps.setup-uv.outcome == 'failure'
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.x"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: cd backend && uv sync --extra dev --frozen
      - name: Compute signal evidence (IC + ARCH)
        run: cd backend && uv run python scripts/compute_evidence.py --data-root=../data
      - name: Compute commit metadata
        id: meta
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Commit evidence
        uses: ./.github/actions/commit-and-push
        with:
          paths: data/latest/signal_evidence.json
          message: "data: signal evidence ${{ steps.meta.outputs.month }}"
      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-frontend.yml --ref main
