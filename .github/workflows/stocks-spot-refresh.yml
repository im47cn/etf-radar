name: Stocks Spot Refresh

# 个股盘口快照独立 cron。30 分钟一次，覆盖 A 股 09:00-15:30 BJT。
# 不触发 deploy-frontend；下次 cn-refresh.yml 会带飞部署（最坏延迟 15 min）。

on:
  schedule:
    - cron: '*/30 1-7 * * 1-5'  # UTC 01:00-07:30 = BJT 09:00-15:30，工作日
  workflow_dispatch:

env:
  # uv 冻结模式: pyproject/uv.lock 漂移(dependabot 改约束未同步 lock)时不改写 uv.lock,
  # 防脏工作树 -> Commit 步骤 git pull --rebase exit 128 停更 (2026-07-09 事故加固)
  UV_FROZEN: "1"

permissions:
  contents: write

concurrency:
  group: stocks-spot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check CN trading day
        id: cal
        run: |
          pip install chinese-calendar -q
          is_trading=$(python -c "
          from datetime import datetime, timezone, timedelta
          import chinese_calendar
          today = (datetime.now(timezone.utc) + timedelta(hours=8)).date()
          # 须与 src/etl/calendar.py is_cn_trading_day 同步: isoweekday 保护 + 调休误判/未来年兜底
          def _ok(d):
              if d.isoweekday() > 5:
                  return False
              try:
                  return chinese_calendar.is_workday(d) and not chinese_calendar.is_holiday(d)
              except NotImplementedError:
                  return False
          ok = _ok(today)
          print('true' if ok else 'false')
          ")
          echo "is_trading=$is_trading" >> $GITHUB_OUTPUT
          echo "trading_day=$is_trading"
      - uses: actions/checkout@v7
        if: steps.cal.outputs.is_trading == 'true'
        with:
          token: ${{ secrets.DATA_BOT_PAT }}
      - uses: astral-sh/setup-uv@v9.0.0
        if: steps.cal.outputs.is_trading == 'true'
        id: setup-uv
        continue-on-error: true
        with:
          version: "0.11.x"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup uv (retry on transient network failure)
        if: steps.cal.outputs.is_trading == 'true' && steps.setup-uv.outcome == 'failure'
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.x"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.cal.outputs.is_trading == 'true'
        run: cd backend && uv sync --extra dev --frozen
      - name: Run stocks_spot pipeline
        if: steps.cal.outputs.is_trading == 'true'
        run: cd backend && uv run python -m src.stocks_spot_pipeline --data-root=../data
      - name: Compute commit metadata
        if: steps.cal.outputs.is_trading == 'true'
        id: meta
        run: echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Commit stocks_spot
        if: steps.cal.outputs.is_trading == 'true'
        uses: ./.github/actions/commit-and-push
        with:
          paths: data/latest/stocks_spot.json
          message: "data: stocks_spot ${{ steps.meta.outputs.ts }}"
