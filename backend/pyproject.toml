[project]
name = "etf-radar-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.1.1",
    "numpy>=1.26.0",
    "pydantic>=2.14.3",
    "PyYAML>=6.0.3",
    "yfinance>=1.8.0",
    "akshare>=1.20.34",
    "chinese-calendar>=1.12.1",
    "pandas-market-calendars>=5.6.0",
    "scipy>=1.12.0",
    "tqdm>=4.70.1",
    "ta>=0.11.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "mypy>=2.4.1",
    "responses>=0.26.3",
    "freezegun>=1.5.5",
    "jsonschema>=4.21.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
skip_empty = true

[dependency-groups]
dev = [
    "diff-cover>=10.6.0",
    "pytest-cov>=7.1.0",
]
