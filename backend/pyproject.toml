[project]
name = "etf-radar-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0.5",
    "numpy>=1.26.0",
    "pydantic>=2.13.4",
    "PyYAML>=6.0.3",
    "yfinance>=1.6.0",
    "akshare>=1.18.92",
    "chinese-calendar>=1.11.0",
    "pandas-market-calendars>=4.4.0",
    "scipy>=1.12.0",
    "tqdm>=4.70.0",
    "ta>=0.11.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "mypy>=2.3.1",
    "responses>=0.26.2",
    "freezegun>=1.5.5",
    "jsonschema>=4.21.0",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
skip_empty = true

[dependency-groups]
dev = [
    "diff-cover>=10.5.1",
    "pytest-cov>=7.1.0",
]
